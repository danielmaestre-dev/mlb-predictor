name: MLB Predictor

on:
  schedule:
    # 06:00 Peru (11:00 UTC) todos los dias
    - cron: '0 11 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  predict:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          pip install requests requests-cache

      - name: Ejecutar predictor
        run: python3 mlbpredictor.py

      - name: Commit y push del history
        run: |
          git config user.email "danielmaestre-dev@users.noreply.github.com"
          git config user.name "danielmaestre-dev"
          git add data/history.json
          git diff --staged --quiet || git commit -m "Actualizar history.json $(date +%Y-%m-%d)"
          git push
